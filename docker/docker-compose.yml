# MediODL - Docker Compose (Optional, Coexistence-Safe)
# Isolated network mediodl_network, no conflict with D_bot (d-bot_default) or 3x-ui (host)
# Does NOT bind 80/443/8000/5432. Only internal health port 127.0.0.1:8787 if enabled.
# Usage: cd /opt/mediodl-bot && docker compose -f docker/docker-compose.yml up -d

name: mediodl

networks:
  mediodl_network:
    name: mediodl_network
    driver: bridge

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mediodl-bot
    restart: unless-stopped
    # Polling mode — no ports needed for Telegram
    # If you want health endpoint, uncomment:
    # ports:
    #   - "127.0.0.1:8787:8787"
    volumes:
      - ../data:/app/data
      - ../tmp:/app/tmp
      - ../cookies:/app/cookies
      - ../.env:/app/.env:ro
    env_file:
      - ../.env
    networks:
      - mediodl_network
    # Resource limits to protect xray/D_bot
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
        reservations:
          memory: 200M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: Local Telegram Bot API for >50MB uploads (up to 2GB) ──
  # Telegram official image: https://github.com/tdlib/telegram-bot-api
  # Enable by uncommenting and setting BOT_API_SERVER=telegram-bot-api in .env
  # telegram-bot-api:
  #   image: aiogram/telegram-bot-api:latest
  #   container_name: mediodl-tgbotapi
